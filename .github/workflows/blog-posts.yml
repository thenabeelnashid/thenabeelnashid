name: Latest blog posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest posts from the RSS feed
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.nabeelnashid.com/feed.xml"
          max_post_count: 5
          comment_tag_name: BLOG-POST-LIST
          date_format: "yyyy-mm-dd"
          template: "- [$title]($url) — `$date`"
